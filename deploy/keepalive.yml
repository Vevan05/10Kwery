# Keeps the Space awake.
#
# A Space sleeps after 48 hours without visitors and wakes with a wiped disk,
# which means re-downloading the 277 MB retrieval index. Pinging /health well
# inside that window avoids the cold start for real visitors.
#
# Set your Space URL as the repository variable SPACE_URL, for example:
#   https://vevan05-10kwery.hf.space

name: Keep 10-Kwery Space warm

on:
  schedule:
    # Every 40 hours - safely inside the 48 hour sleep window.
    - cron: "0 */40 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Space health endpoint
        run: |
          if [ -z "$SPACE_URL" ]; then
            echo "::warning::SPACE_URL is not set; nothing to ping."
            exit 0
          fi
          # The warm-up happens lazily on first use, so ask for the company
          # list: that is what forces the index and models into memory.
          curl --fail --silent --show-error --max-time 900 \
            "$SPACE_URL/api/companies" >/dev/null
          echo "Pinged $SPACE_URL successfully."
